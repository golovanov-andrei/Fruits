<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc">
  <title id="title">Fruits — MobileNetV2 transfer learning</title>
  <desc id="desc">Изображение RGB 128 на 128, замороженная MobileNetV2, Global Average Pooling, Dense 256, Dropout 0.3 и Softmax по классам Fruits-360.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#151d2b"/><stop offset="1" stop-color="#263c39"/></linearGradient></defs>
  <rect width="1100" height="420" rx="22" fill="url(#bg)"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="44" y="58" fill="#fbbf24" font-size="15" font-weight="700" letter-spacing="2">COMPUTER VISION / TRANSFER LEARNING</text>
    <text x="42" y="106" fill="#f8fafc" font-size="37" font-weight="700">Fruits · MobileNetV2</text>
    <text x="44" y="139" fill="#cbd5e1" font-size="17">Классификация изображений Fruits-360</text>
    <g fill="#17212f" stroke="#64748b">
      <rect x="44" y="195" width="164" height="104" rx="12"/>
      <rect x="255" y="195" width="225" height="104" rx="12" stroke="#34d399"/>
      <rect x="527" y="195" width="226" height="104" rx="12"/>
      <rect x="800" y="195" width="256" height="104" rx="12" stroke="#fbbf24"/>
    </g>
    <g stroke="#94a3b8" stroke-width="2" fill="none"><path d="M212 247H245m-8-5 8 5-8 5M484 247H517m-8-5 8 5-8 5M757 247H790m-8-5 8 5-8 5"/></g>
    <g fill="#f8fafc" text-anchor="middle" font-size="18" font-weight="600">
      <text x="126" y="235">Изображение</text><text x="367" y="235">MobileNetV2</text>
      <text x="640" y="235">Классификатор</text><text x="928" y="235">Softmax</text>
    </g>
    <g fill="#94a3b8" text-anchor="middle" font-size="14">
      <text x="126" y="265">128 × 128 · RGB</text><text x="367" y="265">ImageNet · frozen</text>
      <text x="640" y="265">GAP → Dense 256</text><text x="640" y="286">Dropout 0.3</text>
      <text x="928" y="265">269 классов в этом запуске</text>
    </g>
    <text x="44" y="360" fill="#a7f3d0" font-size="16">Train + augmentation → Validation + EarlyStopping → Held-out Test</text>
    <text x="44" y="392" fill="#94a3b8" font-size="12">Схема архитектуры из ноутбука; количество выходов определяется датасетом.</text>
  </g>
</svg>
